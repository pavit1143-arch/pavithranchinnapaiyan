<!DOCTYPE html>
<html>
<body>

<script>
function myStrictFunction() {
  "use strict";
  function nested() {
    return "And so am I!";
  }
  return `Hi! I'm a strict mode function! ${nested()}`;
}

function myNotStrictFunction() {
  return "I'm not strict.";
}

// Call functions
alert(myStrictFunction());
alert(myNotStrictFunction());
</script>

</body>
</html>
